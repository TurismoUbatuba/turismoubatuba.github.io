name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
      - name: Get changed HTML files
        id: changed
        shell: bash
        run: |
          git diff --name-only HEAD^ HEAD -- '*.html' > changed.txt
          if [ ! -s changed.txt ]; then
            echo "Nenhum arquivo HTML alterado. Encerrando."
            echo "urls=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Arquivos alterados:"
          cat changed.txt
          urls=""
          while IFS= read -r file; do
            case "$file" in
              *.html)
                if [ "$file" = "index.html" ]; then
                  url="https://turismoubatuba.com.br/"
                else
                  path="${file%.html}"
                  url="https://turismoubatuba.com.br/${path}"
                fi
                urls="${urls}\"${url}\","
                ;;
            esac
          done < changed.txt
          urls="${urls%,}"
          echo "urls=[$urls]" >> "$GITHUB_OUTPUT"
      - name: Send to IndexNow
        if: steps.changed.outputs.urls != '[]'
        env:
          INDEXNOW_KEY: "09e83a67efa0478dbf3220a5d4bae97c"
          URLS: ${{ steps.changed.outputs.urls }}
        run: |
          curl -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{
              \"host\": \"turismoubatuba.com.br\",
              \"key\": \"09e83a67efa0478dbf3220a5d4bae97c\",
              \"keyLocation\": \"https://turismoubatuba.com.br/09e83a67efa0478dbf3220a5d4bae97c.txt\",
              \"urlList\": ${URLS}
            }"
